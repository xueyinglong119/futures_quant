services:
  futures-api:
    build: .
    image: futures-quant-api:latest
    container_name: futures-quant-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data

  futures-ingest:
    image: futures-quant-api:latest
    container_name: futures-quant-ingest
    restart: unless-stopped
    depends_on:
      - futures-api
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
    # 不跑 HTTP，去掉镜像自带的 :8000 healthcheck，避免一直 unhealthy
    healthcheck:
      disable: true
    command:
      [
        "sh",
        "-c",
        "python -u scripts/run_ingest_pipeline.py >> /app/reports/ingest.log 2>&1",
      ]
    logging:
      options:
        max-size: "20m"
        max-file: "3"

  futures-monitor:
    image: futures-quant-api:latest
    container_name: futures-quant-monitor
    restart: unless-stopped
    depends_on:
      - futures-api
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
    healthcheck:
      disable: true
    command:
      [
        "sh",
        "-c",
        "python -u scripts/run_monitor_service.py >> /app/reports/monitor.log 2>&1",
      ]
    logging:
      options:
        max-size: "20m"
        max-file: "3"

  futures-backtest:
    image: futures-quant-api:latest
    container_name: futures-quant-backtest
    # 一次性回测任务：跑完即退出，不常驻；部署/up 时重跑
    restart: "no"
    depends_on:
      - futures-api
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - BACKTEST_WORKERS=2
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
    healthcheck:
      disable: true
    command:
      [
        "sh",
        "-c",
        "python -u scripts/run_backtest.py >> /app/reports/backtest.log 2>&1",
      ]
    logging:
      options:
        max-size: "20m"
        max-file: "3"
